[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-anywhere"
version = "1.0.0"
description = "Hold a hotkey, speak, release - text appears wherever the cursor is"
requires-python = ">=3.10"

[project.scripts]
whisper-anywhere = "whisper_anywhere.__main__:main"

[project.optional-dependencies]
dev = ["build", "pre-commit", "pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: real-model e2e (needs faster-whisper + model download)"]

[tool.setuptools.packages.find]
include = ["whisper_anywhere*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
