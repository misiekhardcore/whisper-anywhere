name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install evdev
        run: pip install evdev

      - name: Install dev dependencies
        run: make install-deps

      - name: Install package
        run: make install-pkg

      - name: Run tests
        run: make test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Build package
        run: make build

  e2e:
    runs-on: ubuntu-latest
    env:
      WHISPER_E2E: "1"
      WHISPER_E2E_INSTALL: "1"
      MODEL: "tiny.en"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner deps
        run: pip install pytest pytest-asyncio evdev

      - name: Run e2e (install.sh -> tests -> uninstall.sh)
        run: make test-e2e
